<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Tools</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  body{ --page-max:760px; }
  .home{ max-width:760px; margin:0 auto; padding:36px 16px 80px; }
  .home h1{ font-size:30px; font-weight:800; }
  .home > p{ color:var(--ink-muted); font-size:14px; margin:6px 0 26px; }
  .tool-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .tool-card{ display:flex; gap:14px; align-items:flex-start; padding:18px; border-radius:14px; text-decoration:none;
    color:var(--ink); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
    transition:border-color .15s; }
  .tool-card:hover{ border-color:var(--accent); }
  .tool-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .tool-mark{ flex:none; width:40px; height:40px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
    display:grid; place-items:center; font-family:"Archivo",sans-serif; font-weight:800; font-size:18px; }
  .tool-card h2{ font-size:16.5px; }
  .tool-card p{ margin:4px 0 0; color:var(--ink-2); font-size:13px; line-height:1.5; }
</style>
</head>
<body data-tool="home">
<script src="assets/nav.js"></script>

<main class="home">
  <h1>Life Tools</h1>
  <p>Small tools for running my life.</p>
  <div class="tool-grid" id="tools"></div>
</main>

<script>
const grid = document.getElementById('tools');
for (const tool of window.LIFE_TOOLS) {
  const card = document.createElement('a');
  card.className = 'tool-card';
  card.href = tool.path;
  const mark = document.createElement('div');
  mark.className = 'tool-mark';
  mark.setAttribute('aria-hidden', 'true');
  mark.textContent = tool.mark;
  const body = document.createElement('div');
  const h2 = document.createElement('h2');
  h2.textContent = tool.label;
  const p = document.createElement('p');
  p.textContent = tool.description;
  body.append(h2, p);
  card.append(mark, body);
  grid.append(card);
}
</script>
</body>
</html>
